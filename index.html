<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mahjong Score Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Display Screen -->
  <div class="display">
    <h1>Mahjong Score Checker</h1>
    <div id="hand">Hand: </div>
    <div id="score" class="score">Score: 0</div>
    <div id="rules"></div>
    <button id="calcBtn">Calculate Score</button>
  </div>

  <!-- Keyboard -->
  <div class="keyboard" id="keyboard"></div>

  <!-- Load app.js as a module -->
  <script type="module" src="app.js"></script>
</body>
</html>
